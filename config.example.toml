# QuickInput 配置示例
#
# 实际配置文件位置：%APPDATA%\com.quickinput.desktop\default.toml
# 首次启动自动生成；可参照本文件手动编辑，保存后悬浮窗自动刷新。
#
# ─── 按钮结构 ───────────────────────────────────────────────
# [[buttons]]          全局按钮（未匹配任何应用画像时显示）
#   id      = 唯一标识（全局与画像之间也不可重复）
#   label   = 按钮显示文字
#   content = 注入的文本内容，支持 {input} 占位符（见下）
#   comment = 悬浮提示说明（可省略）
#
# ─── {input} 模板占位符 ────────────────────────────────────
# content 中包含 {input} 即为模板按钮（位置任意，不依赖引号）：
#   左键：占位符不输出，其余内容原样注入，光标自动停在占位符位置
#         例：git commit -m "{input}" 左键输出 git commit -m ""（光标在引号中间）
#   右键：弹出「模板输入」对话框，填写内容后合并注入完整命令
#         例：填 first init → 注入 git commit -m "first init"
#   长按（默认 1 秒，可在设置「长按触发时间」调整）：输入后自动回车（同普通按钮）
# 不含 {input} 的按钮为普通按钮：仅左键快捷输入（右键菜单项禁用）。
#
# ─── 动态占位符（后端注入时展开，普通按钮与模板按钮均可用）──
# {date}      = 当前日期，格式 YYYY-MM-DD（例：2026-08-26）
# {time}      = 当前时间，格式 HH:MM:SS 24 小时制（例：14:30:05）
# {clipboard} = 当前剪贴板文本（为空则替换为空字符串）
# 与 {input} 不同，动态占位符由后端在注入瞬间展开，不弹窗、不占光标。
# 例：content = "[{date} {time}] 已处理" 注入为 "[2026-08-26 14:30:05] 已处理"
#
# ─── 交互速查 ──────────────────────────────────────────────
#   左键        输入内容（模板按钮光标停在占位符处）
#   长按超阈值  输入内容 + 回车（执行命令，阈值见 overlay.hold_threshold_ms）
#   右键        模板按钮：弹出模板输入对话框
# ───────────────────────────────────────────────────────────

# ===== 全局按钮（默认组：未匹配任何应用时显示）=====
[[buttons]]
id = "reply-ok"
label = "好的"
content = "好的"
comment = "简洁确认回复"

[[buttons]]
id = "reply-done"
label = "已完成"
content = "已经处理好了，你可以看看"
comment = "告知任务完成"

[[buttons]]
id = "reply-tpl"
label = "转达给"
content = "这个问题我转达给{input}处理"
comment = "模板示例：{input} 填人名（左键光标停在此处，右键模板输入）"

[[buttons]]
id = "var-datetime"
label = "时间戳"
content = "[{date} {time}] "
comment = "动态占位符示例：{date}=当前日期，{time}=当前时间，注入时自动展开"

[[buttons]]
id = "var-clipboard"
label = "粘贴剪贴板"
content = "{clipboard}"
comment = "动态占位符示例：{clipboard}=当前剪贴板内容，注入时自动展开"

# ===== 默认映射（可选）：未匹配任何应用画像时使用 =====
# default_buttons 数组（可省略，省略/为空则回退使用上面的全局按钮组）。
# 按钮顺序即悬浮窗显示顺序（设置界面支持拖拽排序）。
# 与 [[profiles]] 内的按钮写法相同（含 {input} 模板与 comment）。
#
# default_inject_mode（可选）：默认映射的注入模式，未匹配任何画像时生效。
#   "paste"     = 剪贴板粘贴注入（默认；绕过输入法，适合现代应用）
#   "keystroke" = 按键模拟注入（真实键盘扫描码，适合老游戏/DirectInput）
# 示例：把 reply-ok 与 reply-tpl 按自定义顺序设为默认映射
default_buttons = [
  { id = "reply-tpl", label = "转达给", content = "这个问题我转达给{input}处理", comment = "默认映射里的模板按钮" },
  { id = "reply-ok", label = "好的", content = "好的", comment = "简洁确认回复" },
]

# ===== 应用画像：按前台进程名匹配按钮组 =====
# process_name 不区分大小写，匹配进程可执行文件名
#
# inject_mode（可选，画像级）：该应用的注入模式，优先于 default_inject_mode。
#   "paste"     = 剪贴板粘贴（默认）
#   "keystroke" = 按键模拟（老游戏：DirectInput 轮询/自绘输入框不认粘贴
#                 与 Unicode 注入，需真实扫描码；中文等无键位字符仍走
#                 Unicode 通道。游戏以管理员运行时 QuickInput 也需管理员）
# 示例：为 2000 年前后的老游戏客户端配置按键模拟
# [[profiles]]
# process_name = "Droiyan Online.exe"
# name = "红月"
# inject_mode = "keystroke"

[[profiles]]
process_name = "WindowsTerminal.exe"
name = "终端"

[[profiles.buttons]]
id = "git-status"
label = "Git Status"
content = "git status"
comment = "查看工作区状态"

[[profiles.buttons]]
id = "git-commit"
label = "Git Commit"
content = "git commit -m \"{input}\""
comment = "提交（{input} 为模板位：左键光标停在此处，右键模板输入）"

[[profiles.buttons]]
id = "git-checkout"
label = "Git Checkout"
content = "git checkout -b {input}"
comment = "新建并切换分支（{input} 填分支名）"

[[profiles.buttons]]
id = "linux-tail"
label = "tail -f"
content = "tail -f {input}"
comment = "实时查看日志（{input} 填文件路径）"

[[profiles.buttons]]
id = "linux-curl"
label = "curl -s"
content = "curl -s {input}"
comment = "发起请求（{input} 填 URL）"

[[profiles.buttons]]
id = "linux-kill"
label = "kill -9"
content = "kill -9 {input}"
comment = "强制结束进程（{input} 填 PID）"

[[profiles]]
process_name = "Code.exe"
name = "VS Code"

[[profiles.buttons]]
id = "fmt"
label = "Format"
content = "cargo fmt"
comment = "格式化 Rust 代码"

[[profiles.buttons]]
id = "build"
label = "Build"
content = "cargo build"
comment = "编译项目"

# ===== 悬浮窗外观（可省略，使用默认值）=====
[overlay]
layout = "vertical"      # vertical 竖向 | horizontal 横向
vertical_x = 1587        # 窗口位置（屏幕坐标）
vertical_y = 159
vertical_w = 300         # 窗口尺寸
vertical_h = 400
opacity = 85             # 不透明度 30-100（百分比）
always_on_top = true     # 窗口置顶
hold_threshold_ms = 1000 # 长按触发回车的时间（毫秒，200-5000，默认 1000）
                         # 范围内松开仅输入不回车，超过后补发回车

# 边缘吸附记忆（按应用 + 布局分别记忆，通常由拖动吸附自动写入）
# 边值：screen-left/right/top/bottom（吸目标所在显示器边缘，用于全屏/最大化应用）
#       win-left/right/top/bottom（吸应用窗口外侧边缘，用于窗口化应用，跟随窗口移动）
# 拖动悬浮窗靠近边缘（40px 内）自动吸附并记忆；拖离边缘自动解除。
# [overlay.snap_memory."notepad.exe"]
# horizontal = "win-bottom"
# vertical = "screen-right"
